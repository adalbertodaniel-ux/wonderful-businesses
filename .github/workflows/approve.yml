name: Aprovar candidata

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Ticker(s) para mover para a lista principal (ex.: ODFL ou ODFL, FICO)'
        required: true

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mover para a lista principal
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
        run: node scripts/approve.mjs "$TICKERS"
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/candidates.json
          git diff --staged --quiet || git commit -m "Aprova candidata(s): $TICKERS"
          git pull --rebase
          git push
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
