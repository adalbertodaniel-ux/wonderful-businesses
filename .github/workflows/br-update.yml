name: Atualizar cotações Brasil

on:
  workflow_dispatch:
  schedule:
    - cron: '41 21 * * 1-5' # dias úteis, ~18h41 de Brasília (após o fechamento da B3)

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar dados no Fundamentus
        run: node scripts/br-update.mjs
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/br-live.json
          git diff --staged --quiet || git commit -m "Atualiza cotações Brasil $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
