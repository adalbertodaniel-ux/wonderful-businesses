name: Atualizar cotações

on:
  workflow_dispatch: # botão "Run workflow" na aba Actions
  schedule:
    - cron: '17 21 * * 1-5' # dias úteis, ~18h17 de Brasília (após o fechamento em NY)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar dados na Finnhub
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: node scripts/update.mjs
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --staged --quiet || git commit -m "Atualiza cotações $(date -u +%Y-%m-%d)"
          git push
